<svg xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="430"
    viewBox="0 0 900 430">

<defs>

    <!-- Soft green glow -->
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

    <!-- Very subtle window glow -->
    <filter id="windowGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="2" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>

<style>

    .terminal {
        font-family: "Courier New", monospace;
    }

    .main-text {
        font-weight: 700;
    }

    /* Boot animation */
    .boot {
        opacity: 0;
        transform: translateY(8px);
        animation: boot 0.65s ease-out forwards;
    }

    .line1 { animation-delay: 0.20s; }
    .line2 { animation-delay: 0.38s; }
    .line3 { animation-delay: 0.56s; }
    .line4 { animation-delay: 0.74s; }
    .line5 { animation-delay: 0.92s; }
    .line6 { animation-delay: 1.10s; }

    @keyframes boot {
        0% {
            opacity: 0;
            transform: translateY(8px);
        }

        70% {
            opacity: 1;
            transform: translateY(-1px);
        }

        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Cursor */
    .cursor {
        animation: cursorBlink 0.85s steps(1) infinite;
    }

    @keyframes cursorBlink {
        0%, 45% {
            opacity: 1;
        }

        46%, 100% {
            opacity: 0;
        }
    }

    /* Online indicator */
    .status {
        animation: statusPulse 1.8s ease-in-out infinite;
    }

    @keyframes statusPulse {
        0%, 100% {
            opacity: 0.55;
        }

        50% {
            opacity: 1;
        }
    }

    /* Window border */
    .terminal-box {
        animation: terminalPulse 4s ease-in-out infinite;
    }

    @keyframes terminalPulse {
        0%, 100% {
            stroke-opacity: 0.70;
        }

        50% {
            stroke-opacity: 1;
        }
    }

    /* Small scan effect */
    .scan {
        animation: scan 5s ease-in-out infinite;
    }

    @keyframes scan {
        0%, 65%, 100% {
            opacity: 0;
        }

        68% {
            opacity: 0.12;
        }

        72% {
            opacity: 0;
        }
    }

</style>


<!-- ====================================================== -->
<!-- TERMINAL WINDOW -->
<!-- ====================================================== -->

<rect
