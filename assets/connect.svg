<svg xmlns="http://www.w3.org/2000/svg"
width="900" height="230" viewBox="0 0 900 230">

<defs>

<style>

.mono {
    font-family: "DejaVu Sans Mono", "Liberation Mono", monospace;
}

.title {
    fill: #E6EDF3;
    font-size: 13px;
}

.prompt {
    fill: #7EE787;
    font-size: 14px;
}

.command {
    fill: #E6EDF3;
    font-size: 14px;
}

.label {
    fill: #8B949E;
    font-size: 10px;
    letter-spacing: 1.5px;
}

.username {
    fill: #E6EDF3;
    font-size: 14px;
}

.card {
    fill: #0D1117;
    stroke: #30363D;
    stroke-width: 1;
}

.dot {
    fill: #7EE787;
}

.footer {
    fill: #484F58;
    font-size: 10px;
}

</style>

</defs>


<!-- TERMINAL WINDOW -->

<rect
    x="10"
    y="10"
    width="880"
    height="210"
    rx="14"
    fill="#0D1117"
    stroke="#30363D"
    stroke-width="1"
/>


<!-- TRAFFIC LIGHTS -->

<circle cx="34" cy="34" r="5" fill="#FF7B72"/>
<circle cx="52" cy="34" r="5" fill="#D29922"/>
<circle cx="70" cy="34" r="5" fill="#7EE787"/>


<!-- TERMINAL TITLE -->

<text
